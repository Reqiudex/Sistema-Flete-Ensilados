# Nginx sin privilegios (usuario nginx, puerto 8080)
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 128k;

    # IP real del cliente: el tráfico llega por Cloudflare Tunnel (cloudflared → este contenedor).
    # Sin esto el backend vería a todos los clientes con la misma IP y el límite de peticiones sería global.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # CSP: la API va por /api (mismo origen); externos solo Google Fonts y Google Maps.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://maps.google.com https://*.google.com; connect-src 'self' https://*.googleapis.com https://maps.gstatic.com https://cloudflareinsights.com; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Aplicación React (rutas por estado; respaldo a index.html)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Salud del contenedor
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API: el navegador llama a /api en el mismo dominio y Nginx lo reenvía al backend.
    # Se resuelve por DNS interno de Docker en cada petición (no falla si el backend aún no arrancó).
    # Incluye el webhook de la pasarela: /api/pagos/webhook (el cuerpo se reenvía intacto).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
