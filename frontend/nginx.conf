# Nginx sin privilegios (usuario nginx, puerto 8080)
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 128k;

    # Compresión (detrás de Cloudflare ya llega comprimido; esto cubre el acceso directo y las pruebas)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # IP real del cliente: el tráfico llega por Cloudflare Tunnel (cloudflared → este contenedor).
    # Sin esto el backend vería a todos los clientes con la misma IP y el límite de peticiones sería global.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    # Cabeceras de seguridad en un archivo aparte: Nginx descarta las add_header del servidor en cualquier
    # location que declare las suyas, así que cada location con add_header vuelve a incluir este archivo.
    include /etc/nginx/cabeceras-seguridad.conf;

    # Aplicación React (rutas por estado; respaldo a index.html)
    # index.html se revalida siempre: tras un despliegue el navegador no se queda con referencias a assets viejos
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/cabeceras-seguridad.conf;
    }
    # Archivos con huella en el nombre: caché de un año
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/cabeceras-seguridad.conf;
    }

    # Salud del contenedor
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API: el navegador llama a /api en el mismo dominio y Nginx lo reenvía al backend.
    # Se resuelve por DNS interno de Docker en cada petición (no falla si el backend aún no arrancó).
    # Incluye el webhook de la pasarela: /api/pagos/webhook (el cuerpo se reenvía intacto).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
