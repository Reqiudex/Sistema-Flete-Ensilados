version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ensilados-backend
    ports:
      - "3002:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_MAPS_API_KEY=
      - SUPABASE_URL=http://supabase-kong-bx4ixq11kl7vwnrall5bdty0:8000
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - DATABASE_URL=${DATABASE_URL}
    networks:
      coolify: {}
      default:
        aliases:
          - ensilados-backend
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=https://supabase.cherry.lat
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_API_URL=/api
    container_name: ensilados-frontend
    ports:
      - "8087:80"
    depends_on:
      - backend
    networks:
      - default
    restart: always

networks:
  coolify:
    external: true
